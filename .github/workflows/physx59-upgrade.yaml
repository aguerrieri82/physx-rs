name: PhysX 5.9 Upgrade

on:
  push:
    branches:
      - physx-5.9-upgrade
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Patch generator for PhysX 5.9
        run: python3 -c "from pathlib import Path; p=Path('physx-sys/pxbind/src/consumer.rs'); s=p.read_text(); old='        if let Some(bi) = Self::parse_builtin(type_str) {\\n            return Ok(QualType::Builtin(bi));\\n        }\\n'; new=old+'\\n        if type_str == \"__va_list_tag\" {\\n            return Ok(QualType::Builtin(Builtin::Void));\\n        }\\n'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Regenerate bindings
        run: |
          rm -f physx-sys/pxbind/ast-dump.json
          cargo run --manifest-path physx-sys/pxbind/Cargo.toml
      - name: Show generated diff
        if: always()
        run: git status --short && git diff -- physx-sys/pxbind/src/consumer.rs physx-sys/src/physx_generated.hpp physx-sys/src/physx_generated.rs physx-sys/src/structgen/structgen.cpp
      - name: Build pxbind
        if: success()
        run: cargo check --manifest-path physx-sys/pxbind/Cargo.toml
      - name: Build physx-sys
        if: success()
        run: cargo check -p physx-sys
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physx59-generated
          path: |
            physx-sys/pxbind/src/consumer.rs
            physx-sys/src/physx_generated.hpp
            physx-sys/src/physx_generated.rs
            physx-sys/src/structgen/structgen.cpp
          if-no-files-found: ignore
